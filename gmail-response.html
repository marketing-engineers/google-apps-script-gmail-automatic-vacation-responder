<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Out of Office</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background-color: #f8f9fa; color: #333333; line-height: 1.6;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="width: 100%; max-width: 600px; margin: 0 auto; background-color: #ffffff;">
        <tr>
            <td style="padding: 40px 30px 30px 30px;">
                <!-- Logo Section -->
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="width: 100%; margin-bottom: 30px; {{logoDisplay}}">
                    <tr>
                        <td style="text-align: center;">
                            <img src="{{companyLogoUrl}}" alt="{{logoAltText}}" style="max-width: {{logoMaxWidth}}; height: auto; display: block; margin: 0 auto;" />
                        </td>
                    </tr>
                </table>
                
                <!-- Main Content -->
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="width: 100%;">
                    <tr>
                        <td>
                            <h1 style="margin: 0 0 20px 0; font-size: 24px; font-weight: 600; color: #2c3e50; text-align: center;">Out of Office</h1>
                            
                            <p style="margin: 0 0 20px 0; font-size: 16px; color: #555555; text-align: center;">{{outOfOfficeMessage}}</p>
                            
                            <p style="margin: 0 0 30px 0; font-size: 16px; color: #555555; text-align: center;">
                                <strong>I will be back on {{backToWorkDate}}.</strong>
                            </p>
                            
                            <!-- Contact Information Section -->
                            <div style="margin: 30px 0; padding: 20px; background-color: #f8f9fa; border-radius: 6px; border-left: 4px solid #3498db; {{contactDisplay}}">
                                <h3 style="margin: 0 0 15px 0; font-size: 16px; font-weight: 600; color: #2c3e50;">Contact Information</h3>
                                <p style="margin: 5px 0; font-size: 14px; color: #555555; {{phoneDisplay}}">📞 {{phoneNumber}}</p>
                                <p style="margin: 5px 0; font-size: 14px; color: #555555; {{emailDisplay}}">✉️ {{emailAddress}}</p>
                                <p style="margin: 5px 0; font-size: 14px; color: #555555; {{websiteDisplay}}">🌐 <a href="{{websiteUrl}}" style="color: #3498db; text-decoration: none;">{{websiteUrl}}</a></p>
                            </div>
                        </td>
                    </tr>
                </table>
                
                <!-- Signature -->
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="width: 100%; margin-top: 40px; border-top: 1px solid #e1e8ed; padding-top: 20px;">
                    <tr>
                        <td>
                            <p style="margin: 0; font-size: 16px; color: #2c3e50; font-weight: 500;">
                                Best regards,<br>
                                {{yourName}}
                            </p>
                            <p style="margin: 10px 0 0 0; font-size: 14px; color: #7f8c8d;">
                                {{companyName}}
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        
        <!-- Footer -->
        <tr>
            <td style="padding: 20px 30px; text-align: center; background-color: #f8f9fa; border-top: 1px solid #e1e8ed;">
                <p style="margin: 0; font-size: 12px; color: #95a5a6;">
                    This is an automated response. Please do not reply to this email.
                </p>
            </td>
        </tr>
    </table>
</body>
</html>
